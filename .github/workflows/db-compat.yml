name: DB Compatibility

# Runs the dialect-parity suite against both database engines so a query that is
# correct on SQLite but broken on Postgres (or vice-versa) fails at PR time.
#
# Rollout: the Postgres leg starts non-blocking (continue-on-error) because the
# Class 1/2/3 fixes land across several phases. Flip `continue-on-error` to false
# (or delete it) once Phases 1, 3 and 4 are merged and the leg is green — from
# then on it is a required, enforced check.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  db-parity:
    name: parity (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: sqlite
            blocking: true
          - engine: postgres
            blocking: false # TODO: set true after Phases 1+3+4 merge

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: altmount
          POSTGRES_PASSWORD: altmount
          POSTGRES_DB: altmount_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U altmount"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache: true

      - name: Run dialect-parity suite (${{ matrix.engine }})
        continue-on-error: ${{ matrix.blocking == false }}
        env:
          ALTMOUNT_TEST_DB: ${{ matrix.engine }}
          ALTMOUNT_TEST_PG_DSN: postgres://altmount:altmount@localhost:5432/altmount_test?sslmode=disable
        run: |
          go test -v -count=1 -run 'TestParity' ./internal/database/...
